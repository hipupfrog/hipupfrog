<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="석류 타이머">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>석류 레이드 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8efe9;--surface:#fffaf7;--surface2:#f3e2dc;--line:#e6cbc3;--text:#3a121b;--muted:#85555e;
  --ruby:#b81f39;--aril:#d93a55;--leaf:#4a7a1e;--amber:#a86400;--track:#ecd6cf;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c0a0f;--surface:#2a1017;--surface2:#361520;--line:#4d1d2a;--text:#f6e7e3;--muted:#c3949c;
    --ruby:#d42a45;--aril:#ff6b81;--leaf:#9cc45f;--amber:#f2b453;--track:#46192a;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c0a0f;--surface:#2a1017;--surface2:#361520;--line:#4d1d2a;--text:#f6e7e3;--muted:#c3949c;
  --ruby:#d42a45;--aril:#ff6b81;--leaf:#9cc45f;--amber:#f2b453;--track:#46192a;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--aril)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--aril);outline-offset:2px}
.primary{background:var(--ruby);color:#fff;border-color:transparent;font-weight:700}
.armed{background:var(--ruby)!important;color:#fff!important}
.ic{width:34px;height:34px;min-height:34px;padding:0;display:inline-grid;place-items:center;background:transparent;border-color:transparent;color:var(--muted)}
.ic svg{width:18px;height:18px}
input,textarea,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label>input,label>select{margin-top:4px}
[hidden]{display:none!important}

.lobby{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lcard{width:min(380px,100%)}
.lcard .mark{width:64px;height:64px;display:block;margin-bottom:12px}
.lcard h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
.lcard p{margin:0 0 20px}
.lcard .primary{width:100%;margin-top:6px;min-height:46px}
.lcard .ghost{width:100%;margin-top:8px}
.small{font-size:13px}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:18px;padding-top:12px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;margin-right:auto}
.brand svg{width:30px;height:30px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);line-height:1}
.status{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.conn{display:inline-flex;align-items:center;gap:6px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.conn[data-s="live"] i{background:var(--leaf)} .conn[data-s="live"]{color:var(--leaf);font-weight:700}
.conn[data-s="wait"] i{background:var(--amber)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button:not(.ic){font-size:13px;padding:6px 10px;min-height:34px}

main.app{max-width:1200px;margin:0 auto;padding:16px 16px 112px}
.global{display:grid;gap:14px;grid-template-columns:1fr;margin-bottom:24px}
@media (min-width:760px){.global{grid-template-columns:auto 1fr;align-items:start}}
.clear{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lbl{font-size:13px;color:var(--muted);font-weight:500}
.big{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em;min-width:4.2ch}
.memo{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;min-width:0}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mhead button{min-height:30px;padding:2px 10px;font-size:13px}
.mbody{white-space:pre-wrap;word-break:break-all;font-size:14px}
.memo textarea{min-height:92px;resize:vertical}
.mrow{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}

.group{margin-bottom:28px}
.ghead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ghead h2{font-size:17px;margin:0 auto 0 0;display:flex;align-items:baseline;gap:8px}
.ghead h2 span{font-size:13px;font-weight:500;color:var(--muted)}
.ghead button{min-height:32px;padding:4px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.empty{padding:32px 16px;text-align:center;border:1px dashed var(--line);border-radius:16px}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 10px 10px;min-width:0}
.card.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.chead{display:flex;align-items:center}
.nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.seed{position:relative;display:block;width:min(100%,150px);aspect-ratio:1;margin:2px auto 6px;padding:0;border:none;border-radius:50%;background:none;min-height:0}
.seed svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:var(--surface2);stroke:var(--track);stroke-width:8}
.prg{fill:none;stroke:var(--leaf);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .2s}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tt{font-size:clamp(24px,6.6vw,32px);font-weight:700;line-height:1;color:var(--leaf)}
.ts{font-size:12px;color:var(--muted)}
.card[data-st="run"] .tt{color:var(--text)} .card[data-st="run"] .prg{stroke:var(--ruby)}
.card[data-st="soon"] .tt{color:var(--amber)} .card[data-st="soon"] .prg{stroke:var(--amber)}
.adj{display:flex;align-items:center;gap:6px}
.adj button{min-width:46px;min-height:34px;padding:4px 6px;font-size:13px}
.dur{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.card.on .dur{color:var(--amber);font-weight:700}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));overflow-x:auto}
.bar-in{display:flex;gap:8px;width:max-content;margin:0 auto}
.bar button{white-space:nowrap}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,2,5,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(440px,100%);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.overlay{align-items:center;padding:16px}.sheet{border-radius:18px}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mh h3{margin:0;font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 8px}
.err{font-size:13px;color:var(--aril);min-height:1em;margin:0 0 8px}
.wide{width:100%;min-height:44px}
.sheet textarea{min-height:180px;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.prg{transition:none}}
</style>
<script src="firebase-config.js"></script>
</head>
<body>

<main id="lobby" class="lobby">
  <div class="lcard">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M24 12l3-7 5 5 5-5 3 7" fill="none" stroke="#6f8f32" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="32" cy="36" r="24" fill="#c0233c"/><circle cx="32" cy="36" r="15" fill="#7a0f22"/>
      <g fill="#ff8497"><ellipse cx="27" cy="31" rx="3" ry="4"/><ellipse cx="36" cy="30" rx="3" ry="4"/><ellipse cx="32" cy="38" rx="3" ry="4"/><ellipse cx="25" cy="41" rx="3" ry="4"/><ellipse cx="39" cy="40" rx="3" ry="4"/></g>
    </svg>
    <h1>석류 레이드 타이머</h1>
    <p class="muted">같은 방 코드로 들어온 인원끼리 타이머를 실시간으로 함께 봅니다.</p>
    <label>닉네임<input id="nick" maxlength="16" autocomplete="nickname" placeholder="게임 닉네임"></label>
    <label>방 코드<input id="rcode" maxlength="30" autocapitalize="off" autocomplete="off" placeholder="예: seokryu-0928"></label>
    <button class="primary" id="enter">입장</button>
    <button class="ghost" id="install" hidden>바탕화면·홈 화면에 앱 설치</button>
    <p id="lmsg" class="muted small" style="margin-top:10px"></p>
    <p id="ioshint" class="note" hidden>아이폰·아이패드: Safari 하단 공유 버튼 → ‘홈 화면에 추가’를 누르면 앱처럼 실행됩니다.</p>
    <p id="synchint" class="note" hidden>실시간 공유 설정 전이라 이 기기에서만 저장됩니다. 공대장에게 설정된 주소를 받아 접속하세요.</p>
  </div>
</main>

<div id="app" hidden>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M24 12l3-7 5 5 5-5 3 7" fill="none" stroke="#6f8f32" stroke-width="4" stroke-linejoin="round"/><circle cx="32" cy="36" r="24" fill="#c0233c"/><circle cx="32" cy="36" r="13" fill="#7a0f22"/></svg>
      <div>석류<small>레이드 타이머</small></div>
    </div>
    <div class="status">
      <span class="chip">방 <b id="code" class="num"></b></span>
      <span id="conn" class="conn"><i></i><span></span></span>
      <span id="mem" class="muted"></span>
    </div>
    <div class="tools">
      <button id="theme" class="ic" aria-label="밝기 전환"></button>
      <button data-act="invite">초대 링크</button>
      <button data-act="reset-all">모두 초기화</button>
      <button data-act="leave">나가기</button>
    </div>
  </header>
  <main class="app">
    <section class="global">
      <div class="clear">
        <span class="lbl">클리어 타임</span>
        <span id="clear" class="big num">00:00</span>
        <button data-act="clear-toggle" id="clearBtn" class="primary">시작</button>
        <button data-act="clear-reset">초기화</button>
      </div>
      <div id="memo" class="memo"></div>
    </section>
    <div id="groups"></div>
  </main>
  <nav class="bar" aria-label="방 관리">
    <div class="bar-in">
      <button data-act="add-group">파티 추가</button>
      <button data-act="add-timer">타이머 추가</button>
      <button data-act="gimmick">기믹 타이머</button>
      <button data-act="save">설정 내보내기</button>
      <button data-act="load">설정 가져오기</button>
    </div>
  </nav>
</div>

<div id="modal" class="overlay" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
/* ───────── 설정 ───────── */
const STEP = 30, CD_ALERTS = [10, 5, 0], DUR_ALERT = 5, CIRC = 2 * Math.PI * 52;
const FB_VER = "10.12.2";

/* ───────── 유틸 ───────── */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const fmt = (sec, up) => { const v = Math.max(0, up ? Math.floor(sec) : Math.ceil(sec)); const h = Math.floor(v/3600), m = Math.floor(v%3600/60), s = v%60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; };
const uid = () => Math.random().toString(36).slice(2, 10);
const okId = id => /^[A-Za-z0-9_-]{1,40}$/.test(id);
const parseT = s => { s = String(s).trim(); if (!s) return 0; if (s.includes(":")) { const [m, x] = s.split(":"); const v = (+m)*60 + (+x || 0); return Number.isFinite(v) ? v : NaN; } const v = +s; return Number.isFinite(v) ? v : NaN; };
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const arr = x => Array.isArray(x) ? x.filter(v => v != null) : Object.values(x || {});
const ICON = {
  on:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  off:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>',
  reset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>'
};

/* ───────── 상태 ───────── */
const emptyRoom = () => ({ memo: "", groups: [], clear: { running: false, startAt: null, acc: 0 } });
const normRoom = v => {
  v = v || {};
  return {
    memo: String(v.memo || ""),
    groups: arr(v.groups).map(g => ({ id: String(g.id), name: String(g.name || "파티"), timerIds: arr(g.timerIds).map(String) })),
    clear: { running: !!v.clear?.running, startAt: v.clear?.startAt ?? null, acc: +v.clear?.acc || 0 }
  };
};
const S = { nick: "", code: "", mode: "local", connected: false, members: 1, room: emptyRoom(), timers: {}, muted: ls.get("sr.muted", {}), editingMemo: false };

/* ───────── Firebase 실시간 공유 ─────────
 * rooms/{code}/meta       : 메모·파티 구성·클리어 타임
 * rooms/{code}/timers/{id}: 개별 타이머(종료시각은 서버 시계 기준)
 * rooms/{code}/presence   : 접속자(연결 끊기면 자동 삭제)
 */
let offset = 0; const now = () => Date.now() + offset; // 서버 시계 보정 → 기기 간 오차 제거
let rdb = null, metaRef = null, timersRef = null, presRef = null, myPres = null, offs = [];
const loadScript = src => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
const fbP = (async () => {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.databaseURL) return null;
  try {
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-database-compat.js`);
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
    const db = firebase.database(app);
    db.ref(".info/serverTimeOffset").on("value", s => { offset = s.val() || 0; });
    return db;
  } catch { return null; }
})();
const listen = (ref, cb) => { ref.on("value", cb, () => fallbackLocal("방 데이터에 접근할 수 없어 이 기기 전용으로 바꿨습니다.")); offs.push(() => ref.off("value", cb)); };
const onWriteErr = () => toast("동기화에 실패했습니다. 인터넷 연결을 확인하세요.");
const timerBody = t => ({ name: t.name, cd: t.cd, dur: t.dur, endAt: t.endAt ?? null, durEndAt: t.durEndAt ?? null });
function persistLocal() { if (S.mode === "local" && S.code) ls.set("sr.room." + S.code, { room: S.room, timers: S.timers }); }
function saveRoom() { if (S.mode === "shared") metaRef.set(clone(S.room)).catch(onWriteErr); else persistLocal(); }
function saveTimer(id) { const t = S.timers[id]; if (!t) return; if (S.mode === "shared") timersRef.child(id).set(timerBody(t)).catch(onWriteErr); else persistLocal(); }
function dropTimer(id) { if (S.mode === "shared") timersRef.child(id).remove().catch(onWriteErr); }

function stopSync() {
  offs.forEach(f => { try { f(); } catch {} }); offs = [];
  if (myPres) { myPres.onDisconnect().cancel(); myPres.remove().catch(() => {}); myPres = null; }
}
function startLocal() {
  const saved = ls.get("sr.room." + S.code, null);
  S.mode = "local";
  S.room = saved?.room ? normRoom(saved.room) : emptyRoom();
  S.timers = saved?.timers || {};
  renderAll(true);
}
function fallbackLocal(msg) { if (S.mode === "local") return; stopSync(); S.mode = "local"; persistLocal(); renderAll(true); toast(msg); }
function startShared(db) {
  S.mode = "shared";
  const room = db.ref("rooms/" + S.code);
  metaRef = room.child("meta"); timersRef = room.child("timers"); presRef = room.child("presence");
  listen(metaRef, s => { S.room = normRoom(s.val()); renderAll(); });
  listen(timersRef, s => { const v = s.val() || {}; const t = {}; Object.keys(v).forEach(k => t[k] = { id: k, ...v[k] }); S.timers = t; renderAll(); });
  listen(presRef, s => { S.members = s.numChildren(); renderStatus(); });
  const conn = db.ref(".info/connected");
  const onConn = s => {
    S.connected = !!s.val();
    if (S.connected) {
      if (myPres) myPres.remove().catch(() => {});
      myPres = presRef.push();
      myPres.onDisconnect().remove();
      myPres.set({ nick: S.nick.slice(0, 16), at: firebase.database.ServerValue.TIMESTAMP }).catch(() => {});
    }
    renderStatus();
  };
  conn.on("value", onConn); offs.push(() => conn.off("value", onConn));
}

/* ───────── 입장/퇴장 ───────── */
async function enterRoom(code, nick) {
  S.code = code; S.nick = nick; S.members = 1; S.connected = false;
  ls.set("sr.last", { code, nick });
  history.replaceState(null, "", location.pathname + "?room=" + encodeURIComponent(code));

function exportData() {
  const timers = {}; Object.values(S.timers).forEach(t => timers[t.id] = { name: t.name, cd: t.cd, dur: t.dur });

}
function importData(d) {

  const remap = {}, timers = {};

  });
  const groups = room.groups.map(g => ({ id: okId(String(g.id)) ? String(g.id) : uid(), name: String(g.name || "파티").slice(0, 24), timerIds: (g.timerIds || []).map(x => remap[x]).filter(x => x && timers[x]) }));

const fired = {};
function alertOnce(key, f, ms, vib) { if (fired[key]) return; fired[key] = 1; beep(f, ms); try { navigator.vibrate && navigator.vibrate(vib); } catch {} }
function tick() {
  if (!S.code) return;
  const n = now();
  document.querySelectorAll(".card").forEach(c => {
    const t = S.timers[c.dataset.tid]; if (!t) return;
    const running = !!t.endAt && t.endAt > n;
    const left = running ? (t.endAt - n) / 1000 : t.cd;
    const dl = t.durEndAt && t.durEndAt > n ? (t.durEndAt - n) / 1000 : null;
    const st = !running ? "ready" : left <= 10 ? "soon" : "run";
    if (c.dataset.st !== st) c.dataset.st = st;
    c.querySelector(".tt").textContent = fmt(left);
    c.querySelector(".ts").textContent = st === "ready" ? "준비" : st === "soon" ? "곧 준비" : "쿨타임";
    const frac = running ? Math.min(1, left / Math.max(1, t.cd)) : 1;
    c.querySelector(".prg").setAttribute("stroke-dashoffset", String(CIRC * (1 - frac)));
    c.querySelector(".dur").textContent = t.dur > 0 ? `지속 ${fmt(dl ?? t.dur)}` : "";
    c.classList.toggle("on", dl !== null);
    if (!S.muted[t.id]) {
      if (t.endAt) { const l = Math.ceil((t.endAt - n) / 1000); CD_ALERTS.forEach(sec => { if (l <= sec && l > sec - 2) alertOnce(`${t.id}:${t.endAt}:${sec}`, sec === 0 ? 1320 : 880, sec === 0 ? 400 : 160, sec === 0 ? [200, 80, 200] : 80); }); }
      if (t.durEndAt) { const l = Math.ceil((t.durEndAt - n) / 1000); if (l <= DUR_ALERT && l > DUR_ALERT - 2) alertOnce(`${t.id}:${t.durEndAt}:d`, 520, 300, [120, 60, 120]); }
    }
  });
  const cl = S.room.clear;
  $("#clear").textContent = fmt((cl.acc + (cl.running ? n - cl.startAt : 0)) / 1000, true);
}

  $("#enter").onclick = go;
  ["#nick", "#rcode"].forEach(s => $(s).addEventListener("keydown", e => { if (e.key === "Enter") go(); }));
  if (q && last.nick) go(); // 초대 링크 + 저장된 닉네임 → 바로 입장
})();
</script>
</body>
</html>
